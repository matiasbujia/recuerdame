<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cámara Polaroid - Revelado Químico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════════════════════════
       PREFIJO ESTRICTO .pc- (POLAROID CAMERA) - AISLAMIENTO TOTAL
       ═══════════════════════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ede7df;
      color: #2b231f;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      padding: 20px 10px;
    }

    /* ESCENARIO DE REFERENCIA: 380 x 620 px ESCALADO */
    .pc-viewport {
      width: 100%;
      max-width: 380px;
      height: 620px;
      position: relative;
      background: radial-gradient(ellipse at 50% 40%, #fbf9f5 0%, #ede6dc 100%);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12), 0 2px 10px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* FLASH SCREEN OVERLAY */
    .pc-flash {
      position: absolute;
      inset: 0;
      background-color: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity 0.05s ease-out;
    }

    .pc-flash.pc-active {
      opacity: 0.96;
      transition: none;
    }

    /* ENCABEZADO DISCRETO */
    .pc-header {
      width: 100%;
      padding: 16px 20px 0;
      text-align: center;
      z-index: 10;
    }

    .pc-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.18rem;
      font-weight: 600;
      color: #3d2f26;
      letter-spacing: -0.01em;
    }

    /* CAMARA Y ZONAS FÍSICAS */
    .pc-stage {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      margin-top: 10px;
    }

    /* CONTENEDOR DE CÁMARA (TIENE EL SHAKE) */
    .pc-camera-wrap {
      position: relative;
      width: 330px;
      height: 230px;
      z-index: 30; /* La cámara está por encima de la foto */
      transition: transform 0.1s ease;
    }

    .pc-camera-wrap.pc-shaking {
      animation: pcCameraShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes pcCameraShake {
      10%, 90% { transform: translate3d(-2px, 1px, 0) rotate(-0.5deg); }
      20%, 80% { transform: translate3d(3px, -2px, 0) rotate(0.8deg); }
      30%, 50%, 70% { transform: translate3d(-4px, 2px, 0) rotate(-1deg); }
      40%, 60% { transform: translate3d(4px, -1px, 0) rotate(1deg); }
    }

    /* CUERPO DE LA CÁMARA POLAROID RETRO */
    .pc-camera-body {
      position: absolute;
      inset: 0;
      background: linear-gradient(175deg, #f5efe6 0%, #e8decb 100%);
      border-radius: 24px 24px 16px 16px;
      box-shadow: 0 14px 32px rgba(45, 30, 20, 0.22), inset 0 2px 3px rgba(255, 255, 255, 0.8), inset 0 -3px 6px rgba(0, 0, 0, 0.15);
      border: 1px solid #dfd4c0;
      overflow: hidden;
    }

    /* FRANJA POLAROID COLOR / TEXTURA */
    .pc-camera-strip {
      position: absolute;
      bottom: 38px;
      left: 0;
      right: 0;
      height: 7px;
      display: flex;
    }

    .pc-strip-c1 { flex: 1; background: #e53935; }
    .pc-strip-c2 { flex: 1; background: #fb8c00; }
    .pc-strip-c3 { flex: 1; background: #fdd835; }
    .pc-strip-c4 { flex: 1; background: #43a047; }
    .pc-strip-c5 { flex: 1; background: #1e88e5; }

    /* LENTE CENTRAL */
    .pc-lens-outer {
      position: absolute;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2d2522 0%, #151110 100%);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35), inset 0 3px 5px rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #d9ccb6;
    }

    .pc-lens-ring {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #423833 0%, #120e0d 75%);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .pc-lens-glass {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #304a5e 0%, #0d151c 65%, #05080b 100%);
      position: relative;
      overflow: hidden;
    }

    .pc-lens-glass::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 10px;
      width: 20px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      transform: rotate(-35deg);
    }

    /* FLASH UNIT & VIEWFINDER */
    .pc-flash-unit {
      position: absolute;
      top: 20px;
      left: 24px;
      width: 44px;
      height: 32px;
      background: #3a322c;
      border-radius: 6px;
      border: 2px solid #c8baa4;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pc-flash-grid {
      width: 32px;
      height: 20px;
      background: repeating-linear-gradient(90deg, #d8d0c0, #d8d0c0 2px, #423832 2px, #423832 4px);
      border-radius: 3px;
    }

    .pc-viewfinder {
      position: absolute;
      top: 20px;
      right: 26px;
      width: 24px;
      height: 24px;
      background: #1e1917;
      border-radius: 50%;
      border: 3px solid #c8baa4;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
    }

    /* BOTÓN FÍSICO ROJO DE DISPARO */
    .pc-shutter-wrap {
      position: absolute;
      top: 65px;
      right: 20px;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pc-shutter-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff4b5a 0%, #d81b2a 70%, #990c17 100%);
      border: 3px solid #f5efe6;
      box-shadow: 0 4px 10px rgba(180, 20, 30, 0.45), inset 0 2px 3px rgba(255, 255, 255, 0.4);
      cursor: pointer;
      outline: none;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      touch-action: manipulation;
    }

    .pc-shutter-btn:active, .pc-shutter-btn.pc-pressed {
      transform: scale(0.91) translateY(2px);
      box-shadow: 0 1px 4px rgba(180, 20, 30, 0.4), inset 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    /* RANURA FÍSICA INFERIOR DE EXPULSIÓN */
    .pc-camera-slot {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 270px;
      height: 18px;
      background: #181311;
      border-radius: 8px 8px 0 0;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.9), 0 3px 6px rgba(0,0,0,0.2);
      z-index: 35; /* El labio frontal tapa la foto cuando sale */
    }

    /* ═══════════════════════════════════════════════════════
       LA FOTO POLAROID FÍSICA QUE SALE DE LA RANURA
       ═══════════════════════════════════════════════════════ */
    .pc-photo {
      position: absolute;
      top: 140px; /* Escondida detrás del cuerpo de la cámara */
      left: 50%;
      transform: translateX(-50%);
      width: 248px;
      height: 300px;
      background-color: #ffffff;
      padding: 12px 12px 36px 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
      border-radius: 3px;
      z-index: 20; /* Está detrás del labio de la cámara (z-index 35) */
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: none;
      transition: box-shadow 0.25s ease;
    }

    /* ANIMACIÓN FÍSICA DE EXPULSIÓN CON MICRO-TRABAS DE ENGRANAJE */
    .pc-photo.pc-ejecting {
      animation: pcEjectMotor 2.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes pcEjectMotor {
      0% {
        top: 130px;
        transform: translateX(-50%) scale(0.96);
      }
      /* Micro-traba 1: agarre de rodillos */
      14% {
        top: 175px;
        transform: translateX(-50.5%) scale(0.97);
      }
      18% {
        top: 174px;
        transform: translateX(-50%) scale(0.97);
      }
      /* Micro-traba 2: paso de engranaje */
      38% {
        top: 228px;
        transform: translateX(-49.7%) scale(0.98);
      }
      42% {
        top: 227px;
        transform: translateX(-50%) scale(0.98);
      }
      /* Micro-traba 3: salida final */
      68% {
        top: 278px;
        transform: translateX(-50.2%) scale(0.99);
      }
      72% {
        top: 277px;
        transform: translateX(-50%) scale(0.99);
      }
      100% {
        top: 285px;
        transform: translateX(-50%) scale(1) rotate(0.4deg);
      }
    }

    /* Cuando la foto está liberada y lista para sacudir */
    .pc-photo.pc-ejected {
      top: 285px;
      transform: translateX(-50%) rotate(0.4deg);
      z-index: 45; /* Pasa al frente para ser interactiva */
    }

    .pc-photo.pc-dragging {
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
      transition: none !important;
    }

    /* CANVAS DE REVELADO FOTOGRÁFICO */
    .pc-canvas-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #0d0a09;
      position: relative;
      overflow: hidden;
      border-radius: 2px;
    }

    .pc-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* PIE DE FOTO / MICROCOPY DINÁMICO */
    .pc-hint-wrap {
      position: absolute;
      bottom: 22px;
      left: 0;
      right: 0;
      text-align: center;
      padding: 0 16px;
      z-index: 50;
      pointer-events: none;
    }

    .pc-hint {
      display: inline-block;
      font-size: 0.86rem;
      font-weight: 600;
      color: #635345;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      padding: 6px 18px;
      border-radius: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .pc-hint.pc-show {
      opacity: 1;
      transform: translateY(0);
    }

    .pc-signature {
      margin-top: 6px;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.88rem;
      color: #5c4e43;
      text-align: center;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="pc-viewport" id="pc-viewport" data-photo="">
    <!-- FLASH VISUAL -->
    <div class="pc-flash" id="pc-flash"></div>

    <!-- ENCABEZADO -->
    <div class="pc-header">
      <div class="pc-title">Polaroid Instant Camera</div>
    </div>

    <!-- ESCENARIO PRINCIPAL -->
    <div class="pc-stage">
      
      <!-- CÁMARA RETRO -->
      <div class="pc-camera-wrap" id="pc-camera-wrap">
        <div class="pc-camera-body">
          <div class="pc-flash-unit"><div class="pc-flash-grid"></div></div>
          <div class="pc-viewfinder"></div>
          
          <!-- Lente -->
          <div class="pc-lens-outer">
            <div class="pc-lens-ring">
              <div class="pc-lens-glass"></div>
            </div>
          </div>

          <!-- Botón de disparo -->
          <div class="pc-shutter-wrap">
            <button class="pc-shutter-btn" id="pc-shutter" aria-label="Sacar Foto"></button>
          </div>

          <!-- Franja de color Polaroid -->
          <div class="pc-camera-strip">
            <div class="pc-strip-c1"></div>
            <div class="pc-strip-c2"></div>
            <div class="pc-strip-c3"></div>
            <div class="pc-strip-c4"></div>
            <div class="pc-strip-c5"></div>
          </div>

          <!-- Ranura física frontal -->
          <div class="pc-camera-slot"></div>
        </div>
      </div>

      <!-- FOTO FÍSICA QUE EMERGE -->
      <div class="pc-photo" id="pc-photo">
        <div class="pc-canvas-wrap">
          <canvas class="pc-canvas" id="pc-canvas"></canvas>
        </div>
        <div class="pc-signature" id="pc-signature">Polaroid &trade;</div>
      </div>

    </div>

    <!-- MICROCOPY INFORMATIVO DINÁMICO -->
    <div class="pc-hint-wrap">
      <div class="pc-hint" id="pc-hint">Tocá el botón rojo</div>
    </div>
  </div>

  <script>
    'use strict';

    /* ═══════════════════════════════════════════════════════════
       IIFE AUTOEJECUTABLE - AISLAMIENTO TOTAL
       ═══════════════════════════════════════════════════════════ */
    (function () {
      
      /* --- ESTADO INTERNO DEL SISTEMA --- */
      var state = {
        hasShot: false,
        isEjecting: false,
        isEjected: false,
        isDeveloped: false,
        energy: 0,
        progress: 0,
        renderedProgress: -1,
        sourceImage: null,
        fbmNoise: null,
        lastFrameTime: performance.now(),
        motionPermissionRequested: false,
        hasRealMovementStarted: false,
        usesDeviceMotion: false,
        instantIntensity: 0
      };

      /* --- AUDIO SYNTHESIZER (WEB AUDIO API - CERO ARCHIVOS EXTERNOS) --- */
      var audioCtx = null;
      function getAudioContext() {
        if (!audioCtx) {
          var AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      }

      function playMechanicalClick() {
        var ctx = getAudioContext();
        if (!ctx) return;
        var now = ctx.currentTime;
        // 1. Shutter snap (noise burst)
        var bufferSize = ctx.sampleRate * 0.05;
        var noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        var output = noiseBuffer.getChannelData(0);
        for (var i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
        var whiteNoise = ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        var filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(1400, now);
        var gainNode = ctx.createGain();
        gainNode.gain.setValueAtTime(0.85, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.045);
        whiteNoise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(ctx.destination);
        whiteNoise.start(now);

        // 2. Low mechanical thud
        var osc = ctx.createOscillator();
        var oscGain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.07);
        oscGain.gain.setValueAtTime(0.9, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(oscGain);
        oscGain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      }

      function playMotorHum(duration) {
        var ctx = getAudioContext();
        if (!ctx) return;
        var now = ctx.currentTime;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(85, now);
        // Modulación para simular rodillo
        var lfo = ctx.createOscillator();
        var lfoGain = ctx.createGain();
        lfo.frequency.setValueAtTime(14, now);
        lfoGain.gain.setValueAtTime(25, now);
        lfo.connect(osc.frequency);
        lfo.start(now);
        lfo.stop(now + duration);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.18, now + 0.15);
        gain.gain.setValueAtTime(0.18, now + duration - 0.2);
        gain.gain.linearRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      /* ═══════════════════════════════════════════════════════════
         MÁSCARA DE RUIDO FBM (4 OCTAVAS, 112x112, SESGO RADIAL)
         ═══════════════════════════════════════════════════════════ */
      var FBM_SIZE = 112;
      function generateFbmNoise() {
        var grid = new Float32Array(FBM_SIZE * FBM_SIZE);
        var cx = FBM_SIZE / 2, cy = FBM_SIZE / 2;
        var maxDist = Math.sqrt(cx * cx + cy * cy);

        var perm = new Uint8Array(512);
        for (var i = 0; i < 256; i++) perm[i] = perm[256 + i] = Math.floor(Math.random() * 256);

        function noise2D(x, y) {
          var X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
          var xf = x - Math.floor(x), yf = y - Math.floor(y);
          var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
          var g00 = perm[perm[X] + Y], g10 = perm[perm[X + 1] + Y];
          var g01 = perm[perm[X] + Y + 1], g11 = perm[perm[X + 1] + Y + 1];
          var x1 = ((g00 & 1) ? xf : -xf) + ((g00 & 2) ? yf : -yf);
          var x2 = ((g10 & 1) ? (xf - 1) : -(xf - 1)) + ((g10 & 2) ? yf : -yf);
          var y1 = ((g01 & 1) ? xf : -xf) + ((g01 & 2) ? (yf - 1) : -(yf - 1));
          var y2 = ((g11 & 1) ? (xf - 1) : -(xf - 1)) + ((g11 & 2) ? (yf - 1) : -(yf - 1));
          var a = x1 + u * (x2 - x1), b = y1 + u * (y2 - y1);
          return a + v * (b - a);
        }

        for (var y = 0; y < FBM_SIZE; y++) {
          for (var x = 0; x < FBM_SIZE; x++) {
            var val = 0, amp = 0.5, freq = 0.055;
            for (var o = 0; o < 4; o++) {
              val += noise2D(x * freq, y * freq) * amp;
              amp *= 0.5; freq *= 2.0;
            }
            var dx = x - cx, dy = y - cy;
            var dist = Math.sqrt(dx * dx + dy * dy) / maxDist;
            val = (val + 0.5) * 0.72 + (1.0 - dist) * 0.28;
            grid[y * FBM_SIZE + x] = Math.max(0, Math.min(1, val));
          }
        }
        return grid;
      }

      /* ═══════════════════════════════════════════════════════════
         CANVAS & CARGA DINÁMICA CON COVER (CROSS-ORIGIN SAFE)
         ═══════════════════════════════════════════════════════════ */
      var canvas = document.getElementById('pc-canvas');
      var ctx = canvas.getContext('2d');
      var offscreenCoverCanvas = document.createElement('canvas');
      var offscreenCoverCtx = offscreenCoverCanvas.getContext('2d');
      var maskCanvas = document.createElement('canvas');
      maskCanvas.width = FBM_SIZE; maskCanvas.height = FBM_SIZE;
      var maskCtx = maskCanvas.getContext('2d');

      function resizeCanvasBuffer() {
        var rect = canvas.getBoundingClientRect();
        var dpr = window.devicePixelRatio || 1;
        var w = Math.round(rect.width * dpr);
        var h = Math.round(rect.height * dpr);
        if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) {
          canvas.width = w;
          canvas.height = h;
          offscreenCoverCanvas.width = w;
          offscreenCoverCanvas.height = h;
          if (state.sourceImage) drawCoverToOffscreen();
          renderPhoto(true);
        }
      }

      function drawCoverToOffscreen() {
        var S = offscreenCoverCanvas.width;
        if (!S) return;
        offscreenCoverCtx.clearRect(0, 0, S, S);
        var img = state.sourceImage;
        if (!img || !img.width || !img.height) return;

        var scale = Math.max(S / img.width, S / img.height);
        var drawW = img.width * scale;
        var drawH = img.height * scale;
        var dx = (S - drawW) / 2;
        var dy = (S - drawH) / 2;
        offscreenCoverCtx.drawImage(img, dx, dy, drawW, drawH);
      }

      function createDefaultPlaceholder() {
        var pCanvas = document.createElement('canvas');
        pCanvas.width = 600; pCanvas.height = 600;
        var pCtx = pCanvas.getContext('2d');
        var grad = pCtx.createLinearGradient(0, 0, 600, 600);
        grad.addColorStop(0, '#f9d5bb');
        grad.addColorStop(0.5, '#e0a38b');
        grad.addColorStop(1, '#9b5d6b');
        pCtx.fillStyle = grad;
        pCtx.fillRect(0, 0, 600, 600);

        pCtx.fillStyle = '#ffffff';
        pCtx.font = 'italic 38px "Playfair Display", Georgia, serif';
        pCtx.textAlign = 'center';
        pCtx.fillText('Recuerdo Especial', 300, 290);
        pCtx.font = '22px "Plus Jakarta Sans", sans-serif';
        pCtx.fillStyle = 'rgba(255,255,255,0.85)';
        pCtx.fillText('Momentos que quedan grabados', 300, 340);
        return pCanvas;
      }

      function setPhoto(src) {
        if (!src) {
          state.sourceImage = createDefaultPlaceholder();
          drawCoverToOffscreen();
          renderPhoto(true);
          return;
        }

        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function () {
          state.sourceImage = img;
          drawCoverToOffscreen();
          renderPhoto(true);
        };
        img.onerror = function () {
          state.sourceImage = createDefaultPlaceholder();
          drawCoverToOffscreen();
          renderPhoto(true);
        };
        img.src = src;
      }

      /* ═══════════════════════════════════════════════════════════
         SISTEMA DE REVELADO QUÍMICO PROCEDURAL
         ═══════════════════════════════════════════════════════════ */
      function smoothstep(min, max, value) {
        var x = Math.max(0, Math.min(1, (value - min) / (max - min)));
        return x * x * (3 - 2 * x);
      }

      function renderPhoto(force) {
        var P = state.progress;
        if (!force && Math.abs(P - state.renderedProgress) < 0.004) return;
        state.renderedProgress = P;

        var S = canvas.width;
        if (!S) return;

        ctx.clearRect(0, 0, S, S);

        // 1. Si está 100% sin revelar (negro inicial)
        if (P <= 0.001) {
          ctx.fillStyle = '#0f0c0a';
          ctx.fillRect(0, 0, S, S);
          return;
        }

        // 2. Curva tonal y filtros dinámicos en paralelo
        var blurPx = Math.round((1 - P) * 10);
        var brightness = 0.35 + 0.65 * P;
        var contrast = 0.65 + 0.35 * P;
        var saturate = 0.2 + 0.8 * P;
        var sepia = Math.max(0, (1 - P) * 0.45);

        ctx.save();
        if (P < 0.999) {
          ctx.filter = 'blur(' + blurPx + 'px) brightness(' + brightness + ') contrast(' + contrast + ') saturate(' + saturate + ') sepia(' + sepia + ')';
        }
        ctx.drawImage(offscreenCoverCanvas, 0, 0, S, S);
        ctx.restore();

        // 3. Aplicación de la máscara de ruido fBm con smoothstep en multiply
        if (P < 0.995 && state.fbmNoise) {
          var imgData = maskCtx.createImageData(FBM_SIZE, FBM_SIZE);
          var data = imgData.data;
          var noise = state.fbmNoise;
          var threshold = P;
          var edge = 0.16;

          for (var i = 0; i < noise.length; i++) {
            var n = noise[i];
            var factor = smoothstep(threshold - edge, threshold + edge, n);
            var v = Math.round(factor * 255);
            var idx = i * 4;
            data[idx] = v;
            data[idx + 1] = v;
            data[idx + 2] = v;
            data[idx + 3] = 255;
          }
          maskCtx.putImageData(imgData, 0, 0);

          ctx.save();
          ctx.globalCompositeOperation = 'multiply';
          ctx.imageSmoothingEnabled = true;
          ctx.drawImage(maskCanvas, 0, 0, S, S);
          ctx.restore();

          // 4. Velo frío químico en modo 'lighter'
          var veilAlpha = (1 - P) * 0.38 * (1 - P * 0.8);
          if (veilAlpha > 0.01) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = 'rgba(25, 45, 65, ' + veilAlpha + ')';
            ctx.fillRect(0, 0, S, S);
            ctx.restore();
          }

          // 5. Grano químico fotográfico residual
          var grainAlpha = (1 - P) * 0.14;
          if (grainAlpha > 0.01) {
            ctx.save();
            ctx.globalCompositeOperation = 'overlay';
            ctx.fillStyle = 'rgba(180, 160, 140, ' + grainAlpha + ')';
            ctx.fillRect(0, 0, S, S);
            ctx.restore();
          }
        }
      }

      /* ═══════════════════════════════════════════════════════════
         INTEGRACIÓN TEMPORAL POR RAF (TIEMPO REAL x INTENSIDAD)
         ═══════════════════════════════════════════════════════════ */
      var RATE_FACTOR = 0.18;
      function animationLoop(timestamp) {
        var dt = Math.min(0.1, (timestamp - state.lastFrameTime) / 1000);
        state.lastFrameTime = timestamp;

        if (state.isEjected && !state.isDeveloped) {
          if (state.instantIntensity > 0.01) {
            state.energy += state.instantIntensity * dt * RATE_FACTOR;
            state.instantIntensity *= Math.pow(0.15, dt);

            if (!state.hasRealMovementStarted && state.energy > 0.04) {
              state.hasRealMovementStarted = true;
              hideHint();
            }
          }

          // Deriva química mínima (tope 0.62)
          if (state.energy > 0.06 && state.energy < 0.62) {
            state.energy += 0.018 * dt;
          }

          var targetProgress = Math.min(1.0, state.energy);
          state.progress += (targetProgress - state.progress) * Math.min(1, dt * 6.0);

          renderPhoto(false);

          if (state.progress >= 0.996) {
            state.progress = 1.0;
            state.isDeveloped = true;
            renderPhoto(true);
            showHint('✨ Foto revelada');
            setTimeout(hideHint, 2800);
          }
        }

        requestAnimationFrame(animationLoop);
      }

      /* ═══════════════════════════════════════════════════════════
         DETECCIÓN DE MOVIMIENTO (DEVICEMOTION + REVERSAL BONUS)
         ═══════════════════════════════════════════════════════════ */
      var smoothX = 0, lastSmoothX = 0, lastReversalTime = 0;
      var lastAccel = { x: 0, y: 0, z: 0, set: false };

      function handleDeviceMotion(e) {
        if (!state.isEjected || state.isDeveloped) return;
        var a = e.accelerationIncludingGravity || e.acceleration;
        if (!a || a.x === null) return;

        state.usesDeviceMotion = true;

        if (!lastAccel.set) {
          lastAccel = { x: a.x, y: a.y, z: a.z, set: true };
          return;
        }

        var dx = a.x - lastAccel.x;
        var dy = a.y - lastAccel.y;
        var dz = a.z - lastAccel.z;
        lastAccel.x = a.x; lastAccel.y = a.y; lastAccel.z = a.z;

        smoothX = 0.72 * smoothX + 0.28 * dx;

        var now = performance.now();
        var bonus = 1.0;
        if ((smoothX > 0 && lastSmoothX < 0) || (smoothX < 0 && lastSmoothX > 0)) {
          if (now - lastReversalTime < 420) {
            bonus = 1.7;
          }
          lastReversalTime = now;
        }
        lastSmoothX = smoothX;

        var mag = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (mag > 1.8) {
          state.instantIntensity = Math.min(3.6, (mag - 1.8) * bonus * 0.45);
        }
      }

      /* ═══════════════════════════════════════════════════════════
         FALLBACK POR ARRASTRE DE PUNTERO / DEDO (CON REVERSAL)
         ═══════════════════════════════════════════════════════════ */
      var pointer = {
        isDown: false,
        lastX: 0,
        lastY: 0,
        lastTime: 0,
        lastSign: 0,
        lastRevTime: 0
      };

      function setupPointerInteraction() {
        var photoEl = document.getElementById('pc-photo');

        photoEl.addEventListener('pointerdown', function (e) {
          if (!state.isEjected || state.isDeveloped) return;
          
          requestIosMotionPermission();

          pointer.isDown = true;
          pointer.lastX = e.clientX;
          pointer.lastY = e.clientY;
          pointer.lastTime = performance.now();
          photoEl.setPointerCapture(e.pointerId);
          photoEl.classList.add('pc-dragging');

          if (!state.hasRealMovementStarted) {
            updateHintForInteraction();
          }
        });

        photoEl.addEventListener('pointermove', function (e) {
          if (!pointer.isDown || !state.isEjected || state.isDeveloped) return;

          var now = performance.now();
          var dt = (now - pointer.lastTime) || 16;
          var dx = e.clientX - pointer.lastX;
          var dy = e.clientY - pointer.lastY;
          pointer.lastX = e.clientX;
          pointer.lastY = e.clientY;
          pointer.lastTime = now;

          var dist = Math.sqrt(dx * dx + dy * dy);
          var speedPxPerFrame = dist / (dt / 16.66);

          var currentSign = dx > 0 ? 1 : (dx < 0 ? -1 : 0);
          var bonus = 1.0;
          if (currentSign !== 0 && pointer.lastSign !== 0 && currentSign !== pointer.lastSign) {
            if (now - pointer.lastRevTime < 420) {
              bonus = 1.7;
            }
            pointer.lastRevTime = now;
          }
          if (currentSign !== 0) pointer.lastSign = currentSign;

          if (speedPxPerFrame > 1.2) {
            var rawIntensity = (speedPxPerFrame - 1.2) * 0.18 * bonus;
            state.instantIntensity = Math.min(3.8, Math.max(state.instantIntensity, rawIntensity));
          }

          var rot = Math.max(-8, Math.min(8, dx * 0.2));
          photoEl.style.transform = 'translateX(-50%) translate3d(' + (dx * 0.5) + 'px, 0, 0) rotate(' + (0.4 + rot) + 'deg)';
        });

        function endDrag(e) {
          if (!pointer.isDown) return;
          pointer.isDown = false;
          photoEl.classList.remove('pc-dragging');
          photoEl.style.transform = 'translateX(-50%) rotate(0.4deg)';
        }

        photoEl.addEventListener('pointerup', endDrag);
        photoEl.addEventListener('pointercancel', endDrag);
      }

      function requestIosMotionPermission() {
        if (state.motionPermissionRequested) return;
        state.motionPermissionRequested = true;

        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          DeviceMotionEvent.requestPermission()
            .then(function (permission) {
              if (permission === 'granted') {
                window.addEventListener('devicemotion', handleDeviceMotion, { passive: true });
                showHint('Sacudí el teléfono');
              } else {
                showHint('Sacudí la foto con el dedo');
              }
            })
            .catch(function () {
              showHint('Sacudí la foto con el dedo');
            });
        } else if (window.DeviceMotionEvent) {
          window.addEventListener('devicemotion', handleDeviceMotion, { passive: true });
        }
      }

      /* ═══════════════════════════════════════════════════════════
         HINTS / MICROCOPY DINÁMICO
         ═══════════════════════════════════════════════════════════ */
      var hintEl = document.getElementById('pc-hint');
      function showHint(text) {
        hintEl.textContent = text;
        hintEl.classList.add('pc-show');
      }

      function hideHint() {
        hintEl.classList.remove('pc-show');
      }

      function updateHintForInteraction() {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          showHint('Sacudí el teléfono');
        } else if (window.DeviceMotionEvent && state.usesDeviceMotion) {
          showHint('Sacudí el teléfono');
        } else {
          showHint('Sacudí la foto con el dedo');
        }
      }

      /* ═══════════════════════════════════════════════════════════
         SECUENCIA PRINCIPAL DE DISPARO (SHUTTER TRIGGER)
         ═══════════════════════════════════════════════════════════ */
      function triggerShutter() {
        if (state.hasShot) return;
        state.hasShot = true;

        var shutterBtn = document.getElementById('pc-shutter');
        var cameraWrap = document.getElementById('pc-camera-wrap');
        var flashEl = document.getElementById('pc-flash');
        var photoEl = document.getElementById('pc-photo');

        // 1. TOCAR ("Click.")
        shutterBtn.classList.add('pc-pressed');
        playMechanicalClick();

        if (navigator.vibrate) {
          try { navigator.vibrate(35); } catch(e) {}
        }

        // 2. FLASH ("Acaba de sacar la foto.")
        flashEl.classList.add('pc-active');
        setTimeout(function () {
          flashEl.classList.remove('pc-active');
        }, 80);

        // 3. SHAKE DE CÁMARA
        cameraWrap.classList.add('pc-shaking');
        setTimeout(function () {
          cameraWrap.classList.remove('pc-shaking');
          shutterBtn.classList.remove('pc-pressed');
        }, 420);

        hideHint();

        // 4. SALIDA / EXPULSIÓN DE LA FOTO (Rodillos mecánicos)
        setTimeout(function () {
          state.isEjecting = true;
          playMotorHum(2.4);
          photoEl.classList.add('pc-ejecting');

          setTimeout(function () {
            photoEl.classList.remove('pc-ejecting');
            photoEl.classList.add('pc-ejected');
            state.isEjecting = false;
            state.isEjected = true;

            // 5. NEGRO INICIAL + HINT
            renderPhoto(true);
            showHint('Tocá la foto');
          }, 2600);
        }, 200);
      }

      /* ═══════════════════════════════════════════════════════════
         INICIALIZACIÓN Y API PÚBLICA
         ═══════════════════════════════════════════════════════════ */
      function init() {
        state.fbmNoise = generateFbmNoise();
        resizeCanvasBuffer();
        window.addEventListener('resize', resizeCanvasBuffer);

        var shutterBtn = document.getElementById('pc-shutter');
        shutterBtn.addEventListener('click', triggerShutter);

        setupPointerInteraction();

        var viewportEl = document.getElementById('pc-viewport');
        var dataPhoto = viewportEl ? viewportEl.getAttribute('data-photo') : null;
        var urlParams = new URLSearchParams(window.location.search);
        var queryPhoto = urlParams.get('photo');

        var finalPhotoSrc = dataPhoto || queryPhoto;
        setPhoto(finalPhotoSrc);

        renderPhoto(true);
        setTimeout(function () {
          showHint('Tocá el botón rojo');
        }, 400);

        requestAnimationFrame(animationLoop);
      }

      window.addEventListener('DOMContentLoaded', init);

      window.PolaroidCamera = {
        setPhoto: setPhoto,
        shoot: triggerShutter,
        reset: function () {
          state.hasShot = false;
          state.isEjecting = false;
          state.isEjected = false;
          state.isDeveloped = false;
          state.energy = 0;
          state.progress = 0;
          state.renderedProgress = -1;
          state.hasRealMovementStarted = false;
          var p = document.getElementById('pc-photo');
          p.className = 'pc-photo';
          p.style.transform = '';
          renderPhoto(true);
          showHint('Tocá el botón rojo');
        }
      };

    })();
  </script>
</body>
</html>
